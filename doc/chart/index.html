<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳細情報 — M30022222</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #3d7eff;
  --blue-mid: #3b5bdb;
  --blue-dark: #1e3a8a;
  --blue-light: #e8f0ff;
  --blue-pale: #f0f4ff;
  --blue-soft: #dbeafe;
  --border: #e2e8f0;
  --border-light: #eef2f8;
  --border-dashed: #e2e8f0; 
  --bg: #f5f7fa;
  --surface: #ffffff;
  --text-dark: #1a2332;
  --text-mid: #4a5568;
  --text-light: #94a3b8;
  --red: #dc2626;
  --amber: #d97706;
  --yellow: #facc15;
  --header-h: 52px;
  --font: 'Noto Sans JP', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --radius: 5px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  display: flex; flex-direction: column;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-dark);
  font-size: 13px; line-height: 1.5;
}

/* ── Top header ── */
#top-header {
  height: var(--header-h);
  background: var(--blue-light);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 14px;
  flex-shrink: 0; z-index: 100;
}
#top-header img#logo {
  height: 36px;
  width: auto;
}
#top-header h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  gap: 7px;
}
.hd-divider { width: 1px; height: 20px; background: #c7d4ea; }
.hd-spacer { flex: 1; }

/* ── Patient bar ── */
#patient-bar {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 44px;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  overflow-x: auto;
}
.back-btn {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-mid); cursor: pointer;
  padding: 4px 9px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg);
  text-decoration: none; transition: all 0.15s;
}
.back-btn:hover { background: var(--blue-pale); border-color: #c7d8ff; color: var(--blue-mid); }
.pt-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 500; white-space: nowrap; border: 1px solid transparent;
}
.pill-id   { background: var(--blue-pale); color: var(--blue-mid); border-color: #c7d8ff; font-family: var(--mono); }
.pill-gray { background: var(--bg); color: var(--text-mid); border-color: var(--border); }
.pill-cohort{ background: #fffbeb; color: #92400e; border-color: #fde68a; font-size: 10px; }
.pt-spacer { flex: 1; }
.pt-label { font-size: 11px; color: var(--text-light); }
.btn {
  padding: 5px 13px; border-radius: var(--radius);
  font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-mid); font-family: var(--font); transition: all 0.15s;
}
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue-mid); }
.btn-success { background:#16a34a; color:#fff; border-color:#15803d; }
.btn-success:hover { background:#15803d; }

/* ── Legend bar ── */
#legend-bar {
  background: var(--blue-pale); border-bottom: 1px solid var(--border);
  padding: 6px 20px; display: flex; align-items: center; gap: 14px;
  flex-shrink: 0; flex-wrap: wrap;
}
.data-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.leg-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-mid); }
.ldot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.ldot-red { background: var(--red); }
.ldot-yellow { background: var(--yellow); }
.lline { width: 18px; height: 3px; border-radius: 2px; }
.lline-blue { background: var(--blue); }

/* ── Main ── */
#main { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: #fff;}
.tl-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.tl-scroll { flex: 1; overflow: auto; position: relative; }
.tl-table { width: max-content; min-width: 100%; border-collapse: collapse; }

/* Header */
.thead-group th {
  position: sticky; top: 0; z-index: 20;
  background: var(--blue-pale); border-bottom: 1px solid var(--border);
  font-weight: 500; text-align: center; padding: 0;
}
.thead-group th.col-label { left: 0; z-index: 30; text-align: left; width: 190px; min-width: 190px; background:#fff; }

.tp-header { padding: 6px 10px 5px; min-width: 88px; }
.tp-date { font-size: 10px; color: var(--text-light); font-family: var(--mono); display: block; margin-bottom: 1px; }
.tp-name { font-size: 11px; font-weight: 600; display: block; }
.tp-name { color: var(--blue-dark); }
/* Label column (Sticky Left) */
td.row-label {
  position: sticky; left: 0; z-index: 10;
  background: #fff; border-right: 1px solid var(--border);
  padding: 0 0 0 10px; white-space: nowrap;
  font-size: 11px; color: var(--text-mid); height: 32px;
}
td.row-label.sec-hd {
  background: var(--blue-pale); font-size: 11px; font-weight: 700;
  color: var(--blue-mid); letter-spacing: 0.03em; text-transform: uppercase;
  height: 26px; padding-left: 10px; border-top: 1px solid #c7d8ff;
}
td.row-label.sub-hd { background: #f8faff; font-weight: 600; color: var(--text-dark); height: 26px; padding-left: 20px; }
td.row-label.item-row { padding-left: 32px; }
td.row-label.sub-item { padding-left: 44px; color: var(--text-dark); font-weight: 500; }
td.row-label.deep-item { padding-left: 56px; color: var(--text-light); }

/* Collapse Icon */
.toggle-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-mid); font-size: 10px;
  padding: 0 6px 0 0; line-height: 1;
  transition: transform 0.15s;
  display: inline-block; vertical-align: middle;
}
.toggle-btn.collapsed { transform: rotate(-90deg); }

/* Data cells */
td.dc {
  text-align: center; vertical-align: middle; height: 32px;
  border-bottom: 1px dashed var(--border-dashed); 
  position: relative; cursor: pointer; transition: background 0.1s;
}
td.dc:hover { background: rgba(61,126,255,0.04); }
td.dc.no-click { cursor: default; }
td.dc.no-click:hover { background: transparent; }
td.sec-cell.no-click { cursor: default; }
td.sec-cell.no-click .dot { cursor: default; }
td.sec-cell { background: var(--blue-pale); border-bottom: 1px dashed #c7d8ff; height: 26px; border-top: 1px solid #c7d8ff; }
td.sec-cell { text-align: center; vertical-align: middle; }
td.sub-cell { background: #f8faff; border-bottom: 1px dashed var(--border-light); height: 26px; }
.sec-action-cell { padding: 0 10px; }
.section-actions { display:flex; align-items:center; justify-content:flex-start; gap:8px; }
.clinical-section-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.image-timeline-cell {
  padding: 0; height: 32px; min-width: 980px;
  border-bottom: 1px dashed var(--border-dashed);
  position: relative; background: #fff;
}
.image-timeline {
  position: relative; height: 32px; width: 100%;
}
.image-timeline.judge-grid { background: #fff; }
.tp-guide, .interval-guide {
  position: absolute; top: 0; bottom: 0; width: 1px; z-index: 0;
}
.tp-guide { background: rgba(61,126,255,0.18); }
.interval-guide { background: rgba(220,38,38,0.14); }
.image-dot-btn {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  border: none; background: transparent; padding: 5px; cursor: pointer;
  z-index: 2; line-height: 1;
}
.image-dot-btn:hover .dot { transform: scale(1.35); }
.dot-unjudged { border:1.5px solid #94a3b8; background:#e2e8f0; box-shadow:0 0 0 2px rgba(148,163,184,0.12); }
.image-cell {
  overflow: hidden;
}
.image-cell .dot,
.image-cell .dot-wrap {
  position: relative;
  z-index: 2;
}

/* Dots */
.dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  vertical-align: middle; cursor: pointer; transition: transform 0.12s; position: relative;
  z-index: 2;
}
.dot:hover { transform: scale(1.35); }
.dot-blue    { background: var(--blue); box-shadow: 0 0 0 2px rgba(61,126,255,0.15); }
.dot-bluedark { background: var(--blue-dark); box-shadow: 0 0 0 2px rgba(30,58,138,0.15); }
.dot-green   { background:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,0.14); }
.dot-red     { background:#dc2626; box-shadow:0 0 0 2px rgba(220,38,38,0.14); }
.dot-yellow  { background:var(--yellow); box-shadow:0 0 0 2px rgba(250,204,21,0.25); }
.dot-gray    { border: 1.5px solid #c7d4ea; background: #f5f7fa; }
.dot-pending { border: 1.5px dashed #94a3b8; background: transparent; }

.dot-wrap { position: relative; display: inline-block; }
.dot-count {
  position: absolute; top: -6px; right: -7px;
  font-size: 8px; font-weight: 700;
  background: var(--blue-mid); color: #fff;
  border-radius: 50%; width: 12px; height: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); line-height: 1; pointer-events: none; z-index: 3;
}
.dot-surgery {
  width: 9px; height: 9px; border-radius: 2px;
  border: 1.5px solid var(--blue); background: transparent;
  display: inline-block; vertical-align: middle;
}

/* Bars */
.treatment-bar {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 5px; border-radius: 3px; cursor: pointer;
  transition: height 0.15s, opacity 0.15s; z-index: 2;
}
.treatment-bar:hover { height: 8px; opacity: 0.85; }

/* Minimap */
.tl-minimap {
  height: 22px; background: #fff; border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 190px 0 190px; flex-shrink: 0;
}
.mm-track { flex:1; height:5px; background:var(--bg); border-radius:3px; position:relative; cursor:pointer; }
.mm-thumb { position:absolute; top:0; height:100%; background:#c7d8ff; border-radius:3px; min-width:40px; }

/* Drawer & Tooltip */
.drawer-overlay { position:fixed; inset:0; background:rgba(26,35,50,0.18); z-index:200; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.drawer-overlay.open { opacity:1; pointer-events:all; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:370px; background:#fff; border-left:1px solid var(--border); z-index:201; transform:translateX(100%); transition:transform 0.22s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; overflow:hidden; }
.drawer.open { transform:translateX(0); }
.drawer-head { padding:14px 16px 12px; border-bottom:1px solid var(--border); background:var(--blue-pale); display:flex; align-items:flex-start; gap:10px; }
.drawer-title { font-size:14px; font-weight:600; color:var(--text-dark); }
.drawer-sub   { font-size:11px; color:var(--text-light); margin-top:2px; font-family:var(--mono); }
.drawer-close { margin-left:auto; background:none; border:none; cursor:pointer; font-size:16px; color:var(--text-light); padding:2px; }
.drawer-body { flex:1; overflow-y:auto; padding:14px 16px; }
.popup-overlay { position:fixed; inset:0; background:rgba(26,35,50,0.22); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.16s; display:flex; align-items:center; justify-content:center; padding:24px; }
.popup-overlay.open { opacity:1; pointer-events:all; }
.popup { width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 18px 36px rgba(15,23,42,0.18); overflow:hidden; }
.popup-wide { width:min(860px,100%); }
.popup-head { padding:14px 16px 12px; border-bottom:1px solid var(--border); background:var(--blue-pale); display:flex; align-items:flex-start; gap:10px; }
.popup-title { font-size:14px; font-weight:600; color:var(--text-dark); }
.popup-sub { font-size:11px; color:var(--text-light); margin-top:2px; font-family:var(--mono); }
.popup-close { margin-left:auto; background:none; border:none; cursor:pointer; font-size:16px; color:var(--text-light); padding:2px; }
.popup-body { padding:14px 16px 16px; }
.popup-pager { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--border); }
.popup-page-btn { border:1px solid var(--border); background:var(--surface); color:var(--text-mid); border-radius:var(--radius); padding:5px 10px; cursor:pointer; font-family:var(--font); font-size:12px; }
.popup-page-btn:disabled { opacity:0.35; cursor:default; }
.popup-page-indicator { font-size:11px; color:var(--text-light); font-family:var(--mono); }
.popup-actions { display:flex; gap:8px; margin-top:14px; }
.popup-action-btn { flex:1; border:1px solid var(--blue-mid); background:var(--blue); color:#fff; border-radius:var(--radius); padding:8px 10px; cursor:pointer; font-family:var(--font); font-size:12px; font-weight:600; }
.popup-action-btn.secondary { background:#fff; color:var(--blue-mid); }
.judge-table-wrap { max-height: 430px; overflow:auto; border:1px solid var(--border); border-radius:6px; }
.judge-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.judge-table th, .judge-table td { border-bottom:1px solid var(--border-light); border-right:1px solid var(--border-light); padding:9px; text-align:left; vertical-align:top; }
.judge-table th { position:sticky; top:0; background:#f8fafc; color:var(--text-mid); font-weight:600; z-index:2; }
.judge-table tr:last-child td { border-bottom:none; }
.radio-label { display:flex; align-items:center; gap:5px; padding:4px 5px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; }
.radio-label:hover { background:#f8fafc; }
.include-label { color:#15803d; }
.exclude-label { color:#b91c1c; }
.detail-select, .detail-input {
  width:100%; border:1px solid var(--border); border-radius:var(--radius);
  padding:6px 8px; font-size:12px; font-family:var(--font); margin-bottom:6px;
}
.detail-select:focus, .detail-input:focus { border-color:var(--blue-mid); outline:none; }
.single-save-btn {
  width:100%; border:none; background:#16a34a; color:#fff; border-radius:var(--radius);
  padding:7px 10px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font);
}
.single-save-btn:disabled { background:#cbd5e1; cursor:default; }
.status-badge { display:inline-flex; align-items:center; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:600; white-space:nowrap; }
.status-ok { background:#e6f7ff; color:#096dd9; border:1px solid #91d5ff; }
.status-warn { background:#fff7ed; color:#c2410c; border:1px solid #fdba74; }
.status-out { background:#f1f5f9; color:#64748b; border:1px solid #cbd5e1; }
.pdf-overlay { position:fixed; inset:0; z-index:400; background:rgba(15,23,42,0.72); display:none; align-items:center; justify-content:center; padding:24px; }
.pdf-overlay.open { display:flex; }
.pdf-frame { max-width:calc(100vw - 48px); max-height:calc(100vh - 48px); background:#fff; border-radius:8px; box-shadow:0 24px 48px rgba(0,0,0,0.32); overflow:hidden; position:relative; }
.pdf-frame img { display:block; max-width:calc(100vw - 48px); max-height:calc(100vh - 48px); width:auto; height:auto; object-fit:contain; }
.pdf-close { position:absolute; top:8px; right:8px; border:none; background:rgba(15,23,42,0.72); color:#fff; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; line-height:28px; }
.dsec { margin-bottom:16px; }
.dsec-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--blue); margin-bottom:7px; padding-bottom:5px; border-bottom:1px solid var(--blue-soft); }
.fr { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border-light); font-size:12px; }
.fl { color:var(--text-mid); } .fv { color:var(--text-dark); font-weight:500; text-align:right; }
.badge { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:500; }
.badge-ok   { background:#f0fdf4; color:var(--blue-mid); } .badge-warn { background:#fef2f2; color:var(--red); } .badge-pend { background:var(--bg); color:var(--text-mid); border:1px solid var(--border); }

.tooltip { position:fixed; background:var(--text-dark); color:#fff; font-size:11px; padding:6px 10px; border-radius:var(--radius); pointer-events:none; z-index:500; white-space:nowrap; opacity:0; transition:opacity 0.1s; line-height:1.7; }
.tooltip.show { opacity:1; }
.audit-panel {
  position:fixed; top:112px; right:20px; width:min(560px, calc(100vw - 40px));
  max-height:calc(100vh - 140px); overflow:hidden; display:none; flex-direction:column;
  background:#fff; border:1px solid #c7d8ff; border-radius:8px; box-shadow:0 18px 36px rgba(15,23,42,0.16); z-index:250;
}
.audit-panel.open { display:flex; }
.audit-head { padding:12px 14px; border-bottom:1px solid var(--border); background:var(--blue-pale); display:flex; align-items:center; gap:8px; }
.audit-title { font-size:14px; font-weight:700; color:var(--blue-mid); }
.audit-body { padding:12px 14px; overflow:auto; }
.audit-card { border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:8px; background:#fff; }
.audit-card.include { border-color:#86efac; background:#f0fdf4; }
.audit-card.exclude { border-color:#fca5a5; background:#fff7f7; }
.audit-card.out { border-color:#cbd5e1; background:#f8fafc; }
.audit-meta { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:11px; color:var(--text-light); }
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.38); z-index:600; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal-box { width:min(360px,100%); background:#fff; border-radius:8px; border:1px solid var(--border); box-shadow:0 18px 36px rgba(15,23,42,0.2); padding:24px; text-align:center; }
.modal-title { font-size:16px; font-weight:700; margin-bottom:8px; }
.modal-body { color:var(--text-mid); font-size:12px; margin-bottom:18px; }
.modal-btns { display:flex; justify-content:center; gap:10px; }
.toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:700; background:#16a34a; color:#fff; padding:10px 18px; border-radius:7px; font-size:12px; font-weight:700; box-shadow:0 8px 18px rgba(22,163,74,0.24); }
.btn-dicom {
  padding: 7px 16px; border-radius: var(--radius);
  font-size: 12px; font-weight: 600; cursor: pointer;
  background: var(--blue); color: #fff;
  border: none; font-family: var(--font);
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s, box-shadow 0.15s;
  box-shadow: 0 1px 4px rgba(61,126,255,0.25);
}
.btn-dicom:hover { background: var(--blue-mid); box-shadow: 0 2px 8px rgba(61,126,255,0.35); }
.section-label-with-action {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.clinical-section-label .btn-dicom,
.section-label-with-action .btn-dicom {
  padding: 4px 10px;
  font-size: 11px;
  line-height: 1.2;
  box-shadow: none;
}
</style>
</head>
<body>

<div id="top-header">
  <img id="logo" src="../image13215-yqx-200w.png" alt="Logo">
  <h3>参加者ポータル</h3>
  <div class="hd-spacer"></div>
</div>

<div id="patient-bar">
  <a href="../../index.html" class="back-btn">← 戻る</a>
  <div class="pt-sep"></div>
  <span class="pt-label">表示中</span>
  <span class="pill pill-id">M30022222</span>
  <span class="pill pill-gray">75歳</span>
  <span class="pill pill-gray">男性</span>
  <span class="pill pill-gray">登録日：2019-07-31</span>
  <span class="pill pill-cohort">コホートB1：Up-front Surgery を施行する場合</span>
  <span class="pill pill-gray">大腸癌</span>
  <span class="pill pill-gray">生存</span>
  <div class="pt-spacer"></div>
</div>

<div id="legend-bar">
  <div class="data-group">
    <div class="leg-item"><div class="ldot"></div>EDC / 手術 / 臨床画像 / 病理画像</div>
    <div class="leg-item"><span class="dot dot-red"></span>未入力</div>
    <div class="leg-item"><span class="dot dot-blue"></span>入力完了</div>
    <div class="leg-item"><span class="dot dot-yellow"></span>一時保存</div>
  </div>
</div>

<div id="main">
  <div class="tl-wrap">
    <div class="tl-scroll" id="tlScroll">
      <table class="tl-table" id="tlTable">
        <colgroup><col style="width:190px;min-width:190px;"></colgroup>
        <thead id="tlHead"></thead>
        <tbody id="tlBody"></tbody>
      </table>
    </div>
    <div class="tl-minimap">
      <div class="mm-track" id="mmTrack"><div class="mm-thumb" id="mmThumb"></div></div>
    </div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="drawerTitle">—</div>
      <div class="drawer-sub"   id="drawerSub">—</div>

        <div class="popup-title" id="imagePopupTitle">—</div>
        <div class="popup-sub" id="imagePopupSub">—</div>
      </div>

    <div class="audit-title">判定履歴</div>

    <button class="btn" type="button" onclick="toggleAuditPanel(false)">閉じる</button>
  </div>

  <div class="pdf-frame" onclick="event.stopPropagation()">

    <img src="./CTTTpdf.png" alt="report pdf">
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(() => {
  const APP_TPS = [
    { id:'tp-reg', date:'2019-07-31', name:'登録時' },
    { id:'tp-surg', date:'2019-08-31', name:'手術時' },
    { id:'tp-p4', date:'2019-09-28', name:'術後4w' },
    { id:'tp-p12', date:'2019-11-23', name:'術後12w' },
    { id:'tp-p24', date:'2020-02-15', name:'治療開始後24w' },
    { id:'tp-p36', date:'2020-05-09', name:'治療開始後32w' },
    { id:'tp-p48', date:'2020-08-01', name:'治療開始後40w' },
    { id:'tp-rec', date:'2021-01-16', name:'再発時' },
    { id:'tp-rsurg', date:'2021-03-06', name:'初回再発後手術時' },
    { id:'tp-rp4', date:'2021-04-03', name:'初回再発後術後4w' },
  ];
  const IMAGE_TYPES = ['PET-CT', 'CT', 'MRI', 'コンピュータX線撮影', '内視鏡検査'];
  const TP_OPTIONS = APP_TPS.map(tp => `<option value="${tp.id}">${tp.name}</option>`).join('');
  const REASON_OPTIONS = `
    <option value="">-- 理由選択 --</option>
    <option value="医師の判断による許容">医師の判断による許容</option>
    <option value="参加者都合による日程変更">参加者都合による日程変更</option>
  `;
  const appState = {
    judgeMode: true,
    activeJudgeRecords: [],
    auditLog: [],
  };
  let imagePopupState = { records: [], index: 0 };

  const imageEvents = [
    imgEvent('PET-CT', 'tp-reg', '2019-07-24', ['PET-CT画像', 'PET-CTレポート']),
    imgEvent('PET-CT', 'tp-p24', '2020-02-15', ['PET-CT画像', 'PET-CTレポート']),
    imgEvent('PET-CT', 'tp-p48', '2020-08-01', ['PET-CT画像', 'PET-CTレポート']),
    imgEvent('PET-CT', 'tp-rec', '2021-01-16', ['PET-CT画像', 'PET-CTレポート']),
    imgEvent('CT', 'tp-reg', '2019-07-24', ['CT画像', 'CTレポート']),
    imgEvent('CT', 'tp-p24', '2020-02-15', ['CT画像', 'CTレポート']),
    imgEvent('CT', 'tp-p48', '2020-09-05', ['CT画像', 'CTレポート'], { inRange:false }),
    imgEvent('MRI', 'tp-reg', '2019-07-24', ['MRI画像', 'MRIレポート']),
    imgEvent('MRI', 'tp-p48', '2020-09-10', ['MRI画像', 'MRIレポート'], { inRange:false }),
    imgEvent('コンピュータX線撮影', 'tp-p24', '2020-02-15', ['コンピュータX線撮影画像', 'コンピュータX線撮影レポート']),
    imgEvent('内視鏡検査', 'tp-reg', '2019-07-24', ['内視鏡検査画像', '内視鏡検査レポート']),
    imgEvent('内視鏡検査', 'tp-p24', '2020-02-15', ['内視鏡検査画像']),
    imgEvent('内視鏡検査', 'tp-p48', '2020-08-01', ['内視鏡検査画像', '内視鏡検査レポート']),
  ];

  function imgEvent(type, originalTP, actualDate, fileNames, opts = {}) {
    const tp = APP_TPS.find(item => item.id === originalTP);
    return {
      id: `${type}-${originalTP}-${actualDate}-${Math.random().toString(36).slice(2, 7)}`,
      type,
      originalTP,
      actualDate,
      originalDate: actualDate,
      inRange: opts.inRange ?? true,
      decision: 'unjudged',
      assignedTP: '',
      reason: '',
      comment: '',
      files: fileNames.map(name => ({ name, actualDate })),
    };
  }

  function tpById(id) { return APP_TPS.find(tp => tp.id === id); }
  function tpByName(name) { return APP_TPS.find(tp => tp.name === name); }
  const dateMs = date => {
    const [year, month, day] = date.split('-').map(Number);
    return Date.UTC(year, month - 1, day);
  };
  function tpCenterPercent(tp) {
    const index = APP_TPS.findIndex(item => item.id === tp.id);
    return ((index + 0.5) / APP_TPS.length) * 100;
  }
  function datePositionPercent(date) {
    const target = dateMs(date);
    const first = APP_TPS[0];
    const last = APP_TPS[APP_TPS.length - 1];
    if (target <= dateMs(first.date)) {
      return Math.max(0, tpCenterPercent(first) - ((dateMs(first.date) - target) / (28 * 86400000)) * (100 / APP_TPS.length));
    }
    if (target >= dateMs(last.date)) {
      return Math.min(100, tpCenterPercent(last) + ((target - dateMs(last.date)) / (28 * 86400000)) * (100 / APP_TPS.length));
    }
    for (let i = 0; i < APP_TPS.length - 1; i++) {
      const current = APP_TPS[i];
      const next = APP_TPS[i + 1];
      const start = dateMs(current.date);
      const end = dateMs(next.date);
      if (target >= start && target <= end) {
        const ratio = (target - start) / (end - start);
        return tpCenterPercent(current) + (tpCenterPercent(next) - tpCenterPercent(current)) * ratio;
      }
    }
    return tpCenterPercent(first);
  }
  function intervalIndexForDate(date) {
    const target = dateMs(date);
    if (target <= dateMs(APP_TPS[0].date)) return 0;
    for (let i = 0; i < APP_TPS.length - 1; i++) {
      if (target < dateMs(APP_TPS[i + 1].date)) return i;
    }
    return APP_TPS.length - 2;
  }
  function displayTPId(rec) { return rec.decision === 'include' && rec.assignedTP ? rec.assignedTP : rec.originalTP; }
  function displayKey(rec) {
    if (rec.decision === 'include' && rec.assignedTP) return `tp:${rec.assignedTP}`;
    if (rec.inRange) return `tp:${rec.originalTP}`;
    return `mid:${intervalIndexForDate(rec.actualDate)}`;
  }
  function displayPosition(rec) {
    if (rec.decision === 'include' && rec.assignedTP) return tpCenterPercent(tpById(rec.assignedTP));
    if (rec.inRange) return tpCenterPercent(tpById(rec.originalTP));
    return datePositionPercent(rec.actualDate);
  }
  function fallbackPositionForKey(key) {
    if (key.startsWith('tp:')) {
      const tp = tpById(key.slice(3));
      return tp ? tpCenterPercent(tp) : 0;
    }
    if (key.startsWith('mid:')) {
      const index = Number(key.slice(4));
      return (tpCenterPercent(APP_TPS[index]) + tpCenterPercent(APP_TPS[index + 1])) / 2;
    }
    if (key.startsWith('date:')) return datePositionPercent(key.slice(5));
    return 0;
  }
  function measuredTPCenters(timeline) {
    const timelineRect = timeline.getBoundingClientRect();
    if (!timelineRect.width) return null;
    const centers = {};
    document.querySelectorAll('#tlHead .thead-group th[data-tp-id]').forEach(th => {
      const rect = th.getBoundingClientRect();
      centers[th.dataset.tpId] = ((rect.left + rect.width / 2 - timelineRect.left) / timelineRect.width) * 100;
    });
    return centers;
  }
  function measuredDatePercent(date, centers) {
    const target = dateMs(date);
    const first = APP_TPS[0];
    const last = APP_TPS[APP_TPS.length - 1];
    const firstCenter = centers[first.id] ?? tpCenterPercent(first);
    const lastCenter = centers[last.id] ?? tpCenterPercent(last);
    const averageStep = 100 / APP_TPS.length;
    if (target <= dateMs(first.date)) {
      return Math.max(0, firstCenter - ((dateMs(first.date) - target) / (28 * 86400000)) * averageStep);
    }
    if (target >= dateMs(last.date)) {
      return Math.min(100, lastCenter + ((target - dateMs(last.date)) / (28 * 86400000)) * averageStep);
    }
    for (let i = 0; i < APP_TPS.length - 1; i++) {
      const current = APP_TPS[i];
      const next = APP_TPS[i + 1];
      const start = dateMs(current.date);
      const end = dateMs(next.date);
      if (target >= start && target <= end) {
        const ratio = (target - start) / (end - start);
        const currentCenter = centers[current.id] ?? tpCenterPercent(current);
        const nextCenter = centers[next.id] ?? tpCenterPercent(next);
        return currentCenter + (nextCenter - currentCenter) * ratio;
      }
    }
    return firstCenter;
  }
  function measuredPositionForKey(key, centers) {
    if (key.startsWith('tp:')) return centers[key.slice(3)] ?? fallbackPositionForKey(key);
    if (key.startsWith('mid:')) {
      const index = Number(key.slice(4));
      const left = centers[APP_TPS[index]?.id];
      const right = centers[APP_TPS[index + 1]?.id];
      return left != null && right != null ? (left + right) / 2 : fallbackPositionForKey(key);
    }
    if (key.startsWith('date:')) return measuredDatePercent(key.slice(5), centers);
    return fallbackPositionForKey(key);
  }
  function alignImageTimelineLayout() {
    document.querySelectorAll('.image-timeline').forEach(timeline => {
      const centers = measuredTPCenters(timeline);
      if (!centers) return;
      timeline.querySelectorAll('.image-dot-btn[data-pos-key]').forEach(btn => {
        btn.style.left = `${measuredPositionForKey(btn.dataset.posKey, centers)}%`;
      });
      timeline.querySelectorAll('.tp-guide[data-tp-id]').forEach(guide => {
        guide.style.left = `${centers[guide.dataset.tpId] ?? fallbackPositionForKey(`tp:${guide.dataset.tpId}`)}%`;
      });
      timeline.querySelectorAll('.interval-guide[data-interval-index]').forEach(guide => {
        guide.style.left = `${measuredPositionForKey(`mid:${guide.dataset.intervalIndex}`, centers)}%`;
      });
    });
  }
  function cellClass() { return ''; }
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function renderPortal() {
    renderHead();
    renderBody();
    alignImageTimelineLayout();
    syncMinimap();
  }

  function renderDot(d, style) {
    if (!d) return '';
    if (style === 'surgery') return '<span class="dot-surgery"></span>';
    const color = typeof d === 'object' ? d.color : d;
    const count = typeof d === 'object' ? d.count : undefined;
    const cls = { b:'dot-blue', blue:'dot-blue', gray:'dot-gray', pend:'dot-pending', unjudged:'dot-unjudged', red:'dot-red', yellow:'dot-yellow' }[color] || 'dot-blue';
    if (count && count > 1) {
      return `<span class="dot-wrap"><span class="dot ${cls}"></span><span class="dot-count">${count}</span></span>`;
    }
    return `<span class="dot ${cls}"></span>`;
  }

  function syncMinimap() {
    const scr = document.getElementById('tlScroll');
    const thumb = document.getElementById('mmThumb');
    if (!scr || !thumb || !scr.scrollWidth) return;
    const ratio = scr.clientWidth / scr.scrollWidth;
    thumb.style.width = Math.max(30, ratio * 100) + '%';
    thumb.style.left = (scr.scrollLeft / scr.scrollWidth * 100) + '%';
  }

  function renderHead() {
    const headRows = [
      `<tr class="thead-group"><th class="col-label" style="border-right:1px solid var(--border);padding:8px 10px;font-size:11px;color:var(--text-light);font-weight:600;text-align:left;"></th>` +
      APP_TPS.map(tp => `<th data-tp-id="${tp.id}"><div class="tp-header">
        <span class="tp-date">${tp.date}</span><span class="tp-name">${tp.name}</span>
      </div></th>`).join('') + '</tr>'
    ];
    document.getElementById('tlHead').innerHTML = headRows.join('');
  }

  function renderBody() {
    const rows = [];
    rows.push(renderEdcRow());
    rows.push(renderSection('治療'));
    rows.push(renderSimpleDotRow('手術', 'surgery', ['tp-surg', 'tp-rsurg']));
    rows.push(renderClinicalSection());
    IMAGE_TYPES.forEach(type => rows.push(renderImageRow(type)));
    rows.push(renderSection('病理画像'));
    rows.push(renderSimpleDotRow('HE染色', 'blue', ['tp-surg', 'tp-rsurg'], 'path'));
    document.getElementById('tlBody').innerHTML = rows.join('');
  }

  function renderEdcRow() {
    const statuses = [
      { color:'blue', label:'入力完了' },
      { color:'blue', label:'入力完了' },
      { color:'blue', label:'入力完了' },
      { color:'red', label:'未入力' },
      { color:'red', label:'未入力' },
      { color:'blue', label:'入力完了' },
      { color:'yellow', label:'一時保存' },
      { color:'blue', label:'入力完了' },
      { color:'blue', label:'入力完了' },
      { color:'red', label:'未入力' },
    ];
    return `<tr><td class="row-label sec-hd">edc visit</td>` +
      APP_TPS.map((tp, i) => {
        const status = statuses[i] || { color:'blue', label:'入力完了' };
        const cls = status.color === 'red' ? 'dot-red' : status.color === 'yellow' ? 'dot-yellow' : 'dot-blue';
        return `<td class="sec-cell ${cellClass(tp)} no-click">
          <span class="dot ${cls}"
            onmouseenter="showStatusTip(event,'${status.label}')"
            onmouseleave="hideTip()"></span>
        </td>`;
      }).join('') + '</tr>';
  }
  function renderSection(label) {
    return `<tr><td class="row-label sec-hd">${label}</td>${APP_TPS.map(tp => `<td class="sec-cell ${cellClass(tp)}"></td>`).join('')}</tr>`;
  }

  function renderClinicalSection() {
    const actions = `<button class="btn" type="button" onclick="toggleAuditPanel(true)">判定履歴 <span id="auditInlineCount">${appState.auditLog.length || ''}</span></button>
         <button class="btn btn-success" type="button" onclick="confirmSave()">保存</button>`;
    const label = '臨床画像 / 診断レポート';
    return `<tr>
      <td class="row-label sec-hd">${label}</td>
      <td class="sec-cell sec-action-cell" colspan="${APP_TPS.length}">
        <div class="section-actions">${actions}</div>
      </td>
    </tr>`;
  }

  function renderSimpleDotRow(label, style, tpIds, drawerType = '') {
    return `<tr><td class="row-label item-row">${label}</td>` +
      APP_TPS.map(tp => {
        const hasDot = tpIds.includes(tp.id);
        const dot = hasDot ? (style === 'surgery' ? '<span class="dot-surgery"></span>' : '<span class="dot dot-blue"></span>') : '';
        const action = hasDot && drawerType ? ` onclick="openDotDetail('${label}','${tp.id}','${tp.name}','${tp.date}','b','${drawerType}',0)"` : '';
        return `<td class="dc ${cellClass(tp)} ${hasDot ? '' : 'no-click'}"${action}>${dot}</td>`;
      }).join('') + '</tr>';
  }

  function renderImageRow(type) {
    return `<tr><td class="row-label item-row">${type}</td>` +
      `<td class="image-timeline-cell" colspan="${APP_TPS.length}">
        <div class="image-timeline judge-grid">
          ${renderGridGuides()}
          ${renderImageDots(type)}
        </div>
      </td></tr>`;
  }

  function renderGridGuides() {
    const tpGuides = APP_TPS.map(tp => `<span class="tp-guide" data-tp-id="${tp.id}" style="left:${tpCenterPercent(tp)}%;"></span>`).join('');
    const intervalGuides = APP_TPS.slice(0, -1).map((_, i) => `<span class="interval-guide" data-interval-index="${i}" style="left:${fallbackPositionForKey(`mid:${i}`)}%;"></span>`).join('');
    return tpGuides + intervalGuides;
  }

  function renderImageDots(type) {
    const visible = imageEvents.filter(rec => {
      if (rec.type !== type) return false;
      if (rec.decision === 'unjudged' && !rec.inRange) return appState.judgeMode;
      return rec.decision !== 'exclude';
    });
    const keys = [...new Set(visible.map(displayKey))].sort((a, b) => fallbackPositionForKey(a) - fallbackPositionForKey(b));
    return keys.map(key => {
      const records = visible.filter(rec => displayKey(rec) === key);
      const hasUnjudgedOutside = records.some(rec => !rec.inRange && rec.decision === 'unjudged');
      const hasOut = records.some(rec => rec.decision === 'out');
      const color = appState.judgeMode && (hasUnjudgedOutside || hasOut) ? 'red' : hasOut ? 'gray' : 'b';
      const count = records.length > 1 ? records.length : undefined;
      return `<button class="image-dot-btn" type="button" data-pos-key="${key}" style="left:${fallbackPositionForKey(key)}%;" onclick="handleImageSlot('${type}','${key}')">
        ${renderDot({ color, count })}
      </button>`;
    }).join('');
  }

  window.handleImageSlot = function(type, key) {
    const records = imageEvents.filter(rec => {
      if (rec.type !== type) return false;
      if (rec.decision === 'unjudged' && !rec.inRange && !appState.judgeMode) return false;
      if (rec.decision === 'exclude') return false;
      return displayKey(rec) === String(key);
    });
    const position = fallbackPositionForKey(key);
    const tp = tpById(displayTPId(records[0])) || nearestTPByPosition(position);
    if (appState.judgeMode) openJudgePopup(type, tp, records, position);
    else openImagePopupForRecords(type, tp, records, position);
  };

  function nearestTPByPosition(position) {
    return APP_TPS.reduce((best, tp) => Math.abs(tpCenterPercent(tp) - position) < Math.abs(tpCenterPercent(best) - position) ? tp : best, APP_TPS[0]);
  }

  function openImagePopupForRecords(type, tp, records, position) {
    imagePopupState = { records: records.map((rec, i) => ({
      examDate: rec.actualDate,
      timepointId: displayTPId(rec),
      timepointName: rec.decision === 'out' ? '規定外' : (tpById(displayTPId(rec))?.name || tp.name),
      examType: rec.type,
      occurrence: i,
      decision: rec.decision,
      reason: rec.reason,
      inRange: rec.inRange,
    })), index: 0 };
    document.getElementById('imagePopup').classList.remove('popup-wide');
    document.getElementById('imagePopupTitle').textContent = type;
    document.getElementById('imagePopupSub').textContent = records.some(rec => rec.decision === 'out')
      ? '判定：規定外'
      : `${tp.name}  ·  ${tp.date}`;
    renderImagePopup();
    document.getElementById('imagePopupOverlay').classList.add('open');
  }

  function openJudgePopup(type, tp, records, position) {
    appState.activeJudgeRecords = records;
    document.getElementById('imagePopup').classList.add('popup-wide');
    const requiresJudgment = records.some(requiresImageJudgment);
    document.getElementById('imagePopupTitle').textContent = requiresJudgment ? `${type} 判定` : type;
    document.getElementById('imagePopupSub').textContent = requiresJudgment
      ? `実施日位置  ·  ${Number(position).toFixed(1)}%`
      : `${tp.name}  ·  ${tp.date}`;
    renderJudgePopup();
    document.getElementById('imagePopupOverlay').classList.add('open');
  }

  function requiresImageJudgment(rec) {
    return !rec.inRange && rec.decision === 'unjudged';
  }

  function tpReasonCell(rec) {
    if (rec.decision === 'out') {
      return `<strong>規定外</strong>${rec.reason ? `<span style="display:block;font-size:12px;color:var(--text-light);margin-top:3px;">理由: ${esc(rec.reason)}</span>` : ''}`;
    }
    const tpName = tpById(displayTPId(rec))?.name || '—';
    const reason = rec.reason || (rec.decision === 'include' ? '—' : '');
    return `<strong>${esc(tpName)}</strong>${reason ? `<span style="display:block;font-size:12px;color:var(--text-light);margin-top:3px;">理由: ${esc(reason)}</span>` : ''}`;
  }

  function renderJudgePopup() {
    const records = appState.activeJudgeRecords;
    const needsJudgment = records.some(requiresImageJudgment);
    const hasJudged = records.some(rec => rec.decision === 'include' || rec.decision === 'out');
    const mode = needsJudgment ? 'judge' : hasJudged ? 'judged' : 'inRange';
    const headers = {
      inRange: '<th width="60%">検査ファイル</th><th width="40%">実施日</th>',
      judged: '<th width="30%">検査ファイル</th><th width="20%">実施日</th><th width="50%">Timepoint・理由</th>',
      judge: '<th width="24%">検査ファイル</th><th width="16%">実施日</th><th width="30%">判定</th><th width="30%">Timepoint・理由</th>',
    }[mode];
    const colCount = mode === 'inRange' ? 2 : mode === 'judged' ? 3 : 4;
    const rows = records.map((rec, i) => {
      const fileCell = `<strong>${esc(rec.type)}</strong><br><span style="color:var(--text-light);font-size:11px;">${rec.files.map(f => esc(f.name)).join('<br>')}</span>`;
      const dateCell = `<span style="font-family:var(--mono);">${esc(rec.actualDate)}</span>`;
      if (mode === 'inRange') {
        return `<tr><td>${fileCell}</td><td>${dateCell}</td></tr>`;
      }
      if (mode === 'judged') {
        return `<tr><td>${fileCell}</td><td>${dateCell}</td><td>${tpReasonCell(rec)}</td></tr>`;
      }
      if (!requiresImageJudgment(rec)) {
        return `<tr><td>${fileCell}</td><td>${dateCell}</td><td><span style="color:var(--text-light);">判定不要</span></td><td>${tpReasonCell(rec)}</td></tr>`;
      }
      return `<tr style="background:#fffcfc;">
        <td>${fileCell}</td>
        <td>${dateCell}</td>
        <td>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label class="radio-label include-label"><input type="radio" name="dec-${i}" value="include" onchange="updateRowState(${i})"> 規定内</label>
            <label class="radio-label exclude-label"><input type="radio" name="dec-${i}" value="out" onchange="updateRowState(${i})"> 規定外</label>
          </div>
        </td>
        <td id="row-detail-${i}"><span style="color:var(--text-light);font-size:12px;">選択してください</span></td>
      </tr>`;
    }).join('');
    document.getElementById('imagePopupBody').innerHTML = `
      <div class="judge-table-wrap">
        <table class="judge-table">
          <thead><tr>${headers}</tr></thead>
          <tbody>${rows || `<tr><td colspan="${colCount}" style="text-align:center;color:var(--text-light);padding:24px;">データがありません</td></tr>`}</tbody>
        </table>
      </div>`;
  }

  window.updateRowState = function(i) {
    const checked = document.querySelector(`input[name="dec-${i}"]:checked`);
    const detail = document.getElementById(`row-detail-${i}`);
    if (!checked || !detail) return;
    if (checked.value === 'include') {
      detail.innerHTML = `
        <select id="sel-tp-${i}" class="detail-select" onchange="checkSingleValid(${i})">
          <option value="">-- Timepoint選択 --</option>
          ${TP_OPTIONS}
        </select>
        <select id="sel-rs-${i}" class="detail-select" onchange="checkSingleValid(${i})">${REASON_OPTIONS}</select>
        <button class="single-save-btn" id="save-btn-${i}" disabled onclick="saveSingleDecision(${i})">保存</button>`;
    } else {
      detail.innerHTML = `
        <select id="sel-rs-${i}" class="detail-select" onchange="checkSingleValid(${i})">${REASON_OPTIONS}</select>
        <input type="text" id="inp-out-comm-${i}" class="detail-input" placeholder="コメント（任意）" oninput="checkSingleValid(${i})">
        <button class="single-save-btn" id="save-btn-${i}" disabled onclick="saveSingleDecision(${i})">保存</button>`;
    }
    checkSingleValid(i);
  };

  window.checkSingleValid = function(i) {
    const checked = document.querySelector(`input[name="dec-${i}"]:checked`);
    const btn = document.getElementById(`save-btn-${i}`);
    if (!checked || !btn) return;
    const rs = document.getElementById(`sel-rs-${i}`)?.value;
    if (checked.value === 'include') {
      const tp = document.getElementById(`sel-tp-${i}`)?.value;
      btn.disabled = !(tp && rs);
      return;
    }
    btn.disabled = !rs;
  };

  window.saveSingleDecision = function(i) {
    const rec = appState.activeJudgeRecords[i];
    const checked = document.querySelector(`input[name="dec-${i}"]:checked`);
    if (!rec || !checked) return;
    const now = new Date();
    const timestamp = now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });

    if (checked.value === 'include') {
      const tpVal = document.getElementById(`sel-tp-${i}`).value;
      const reason = document.getElementById(`sel-rs-${i}`).value;
      rec.reason = reason;
      rec.comment = '';
      rec.decision = 'include';
      rec.assignedTP = tpVal;
      pushAudit(rec, timestamp);
    } else {
      rec.decision = 'out';
      rec.assignedTP = '';
      rec.reason = document.getElementById(`sel-rs-${i}`)?.value || '';
      rec.comment = document.getElementById(`inp-out-comm-${i}`)?.value.trim() || '';
      pushAudit(rec, timestamp);
    }
    renderPortal();
    renderJudgePopup();
    updateAuditBadge();
  };

  function pushAudit(rec, timestamp) {
    appState.auditLog.push({
      actionType: rec.decision,
      visit: `${rec.decision === 'out' ? '規定外' : (tpById(displayTPId(rec))?.name || '未判定')} - ${rec.type}`,
      type: rec.type,
      timestamp,
      operator: 'Dr. 山田',
      reason: rec.reason || rec.comment || '—',
      files: rec.files.map(f => ({ name:f.name, actualDate:f.actualDate })),
      assignedTP: rec.decision === 'out' ? '規定外' : (rec.assignedTP ? tpById(rec.assignedTP)?.name : '—'),
    });
  }

  function updateAuditBadge() {
    const inline = document.getElementById('auditInlineCount');
    if (inline) inline.textContent = appState.auditLog.length || '';
  }

  window.toggleAuditPanel = function(forceOpen) {
    const panel = document.getElementById('auditPanel');
    if (forceOpen === false) {
      panel.classList.remove('open');
      return;
    }
    renderAuditBody();
    panel.classList.toggle('open', forceOpen === true ? true : undefined);
  };

  function renderAuditBody() {
    const body = document.getElementById('auditBody');
    if (!appState.auditLog.length) {
      body.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:18px;">履歴がありません</p>';
      return;
    }
    body.innerHTML = appState.auditLog.slice().reverse().map(r => {
      const cls = r.actionType === 'include' ? 'include' : 'out';
      const label = r.actionType === 'include' ? '規定内' : '規定外';
      return `<div class="audit-card ${cls}">
        <div class="audit-meta"><strong style="color:var(--text-dark);">${esc(r.visit)}</strong><span>${r.timestamp}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
          <span class="status-badge ${r.actionType === 'out' ? 'status-out' : 'status-ok'}">${label}</span>
          <span class="status-badge status-out">判定者: ${esc(r.operator)}</span>
          <span class="status-badge status-out">Timepoint: ${esc(r.assignedTP)}</span>
        </div>
        <div style="font-size:11px;color:var(--text-mid);margin-bottom:6px;">理由: ${esc(r.reason)}</div>
        <table style="width:100%;font-size:11px;border-collapse:collapse;">
          <tbody>${r.files.map(f => `<tr><td style="padding:3px 0;border-top:1px solid rgba(148,163,184,0.25);">${esc(f.name)}</td><td style="padding:3px 0;border-top:1px solid rgba(148,163,184,0.25);font-family:var(--mono);text-align:right;">${f.actualDate}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;
    }).join('');
  }

  window.openImageViewerFromSection = function() {
    window.open('./viewer/index.html?exam=CT&timepoint=tp-reg&occurrence=0', '_blank', 'noopener');
  };

  window.confirmSave = function() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">変更を保存しますか？</div>
        <div class="modal-body">判定結果を保存します。</div>
        <div class="modal-btns">
          <button class="btn btn-success" id="confirm-save-btn" type="button">保存</button>
          <button class="btn" id="cancel-save-btn" type="button">キャンセル</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#confirm-save-btn').onclick = () => {
      overlay.remove();
      closeImagePopup();
      toggleAuditPanel(false);
      renderPortal();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = '変更が保存されました';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.35s'; setTimeout(() => toast.remove(), 350); }, 2400);
    };
    overlay.querySelector('#cancel-save-btn').onclick = () => overlay.remove();
  };

  window.showStatusTip = function(e, status) {
    const tt = document.getElementById('tooltip');
    tt.innerHTML = status;
    tt.classList.add('show');
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  };

  window.hideTip = function() {
    document.getElementById('tooltip').classList.remove('show');
  };

  window.closeImagePopup = function(e) {
    if (e && e.target !== document.getElementById('imagePopupOverlay')) return;
    document.getElementById('imagePopupOverlay').classList.remove('open');
    document.getElementById('imagePopup').classList.remove('popup-wide');
  };

  window.openReportPdf = function() {
    document.getElementById('pdfOverlay').classList.add('open');
  };

  window.closeReportPdf = function(e) {
    if (e && e.target !== document.getElementById('pdfOverlay')) return;
    document.getElementById('pdfOverlay').classList.remove('open');
  };

  window.changeImagePopupPage = function(delta) {
    const next = imagePopupState.index + delta;
    if (next < 0 || next >= imagePopupState.records.length) return;
    imagePopupState.index = next;
    window.renderImagePopup();
  };

  window.openImageViewer = function() {
    const rec = imagePopupState.records[imagePopupState.index];
    if (!rec) return;
    const query = new URLSearchParams({
      exam: rec.examType,
      timepoint: rec.timepointId,
      occurrence: String(rec.occurrence || 0),
    });
    window.open(`./viewer/index.html?${query.toString()}`, '_blank', 'noopener');
  };

  window.openDotDetail = function(label, tpId, tpName, tpDate) {
    document.getElementById('drawerTitle').textContent = label;
    document.getElementById('drawerSub').textContent = `${tpName}  ·  ${tpDate}`;
    document.getElementById('drawerBody').innerHTML = `
      <div class="dsec"><div class="dsec-title">データ状態</div>
        <div class="fr"><span class="fl">項目名</span><span class="fv">${esc(label)}</span></div>
        <div class="fr"><span class="fl">タイムポイント</span><span class="fv">${esc(tpName)}</span></div>
        <div class="fr"><span class="fl">収集日</span><span class="fv" style="font-family:var(--mono)">${esc(tpDate)}</span></div>
      </div>`;
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  };

  window.closeDrawer = function() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  };

  window.renderImagePopup = function() {
    const { records, index } = imagePopupState;
    const rec = records[index];
    const multiple = records.length > 1;
    const statusLabel = rec.decision === 'include' ? '規定内' : rec.decision === 'out' ? '規定外' : '未判定';
    const statusClass = rec.decision === 'include' ? 'status-ok' : rec.decision === 'out' ? 'status-out' : 'status-warn';
    const tpText = rec.decision === 'out' ? '規定外' : rec.timepointName;
    document.getElementById('imagePopupBody').innerHTML = `
      <div class="dsec" style="margin-bottom:0;">
        <div class="dsec-title">検査情報</div>
        <div class="fr"><span class="fl">検査日</span><span class="fv" style="font-family:var(--mono)">${rec.examDate}</span></div>
        <div class="fr"><span class="fl">timepoint</span><span class="fv">${tpText}</span></div>
        <div class="fr"><span class="fl">判定</span><span class="fv"><span class="status-badge ${statusClass}">${statusLabel}</span></span></div>
        <div class="fr"><span class="fl">検査種別</span><span class="fv">${rec.examType}</span></div>
      </div>
      <div class="popup-actions">
        <button class="popup-action-btn" type="button" onclick="openImageViewer()">画像閲覧</button>
        <button class="popup-action-btn secondary" type="button" onclick="openReportPdf()">診断レポート閲覧</button>
      </div>
      ${multiple ? `<div class="popup-pager">
        <button class="popup-page-btn" type="button" onclick="changeImagePopupPage(-1)" ${index === 0 ? 'disabled' : ''}>前へ</button>
        <span class="popup-page-indicator">${index + 1} / ${records.length}</span>
        <button class="popup-page-btn" type="button" onclick="changeImagePopupPage(1)" ${index === records.length - 1 ? 'disabled' : ''}>次へ</button>
      </div>` : ''}`;
  };

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('saveSuccess') === 'true') {
      sessionStorage.removeItem('saveSuccess');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = '変更が保存されました';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.35s'; setTimeout(() => toast.remove(), 350); }, 2400);
    }
  });

  document.getElementById('tlScroll').addEventListener('scroll', syncMinimap);
  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (!tt.classList.contains('show')) return;
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  });
  window.addEventListener('resize', () => {
    alignImageTimelineLayout();
    syncMinimap();
  });
  if (document.fonts?.ready) {
    document.fonts.ready.then(() => alignImageTimelineLayout());
  }
  renderPortal();
})();
</script>
</body>
</html>
